<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>О программе — Фотоцентр</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/workspace.css"></head><body><div class="app-shell" id="app-shell"></div><template id="info-content">
<div class="info-intro card"><span class="info-kicker">ФОТОЦЕНТР · ВЕРСИЯ 1.0</span><h2>Больше времени на творчество.<br>Меньше — на рутину.</h2><p>Автоматизированное рабочее место для фотоцентра и полиграфии. Приложение помогает вести заказы, хранить контакты заказчиков, учитывать услуги, материалы и оплаты.</p><a class="btn btn-primary" href="help.html">Открыть руководство →</a></div>
<div class="info-grid"><section class="card card-pad"><h2>Что умеет приложение</h2><ul><li>Показывать общую картину работы на панели «Обзор».</li><li>Сопровождать заказ от создания до выдачи.</li><li>Хранить контакты заказчиков и каталог услуг.</li><li>Учитывать расход и поступление материалов.</li><li>Записывать оплаты и показывать остаток к оплате.</li><li>Учитывать макеты и их согласование.</li></ul></section><section class="card card-pad"><h2>Как устроена работа</h2><p>Войдите под логином и паролем сотрудника. Его имя отображается в правом верхнем углу. Добавьте заказчика, создайте заказ, укажите услуги и материалы, затем обновляйте статус по мере выполнения.</p><p>Данные хранятся в подключённой базе Microsoft SQL Server. Для загрузки и сохранения записей сервер приложения и база должны быть доступны.</p><a class="subtle-link" href="orders.html">Перейти к заказам →</a></section></div>
</template><script src="js/api.js"></script><script src="js/nav.js"></script><script>renderShell('about.html', 'О программе');document.getElementById('page-content').append(document.getElementById('info-content').content.cloneNode(true));</script></body></html>
