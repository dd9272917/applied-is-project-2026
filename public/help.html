<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Как пользоваться — Фотоцентр</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/workspace.css"></head><body><div class="app-shell" id="app-shell"></div><template id="info-content">
<div class="dashboard-welcome"><div><strong>Первый заказ — за несколько шагов</strong><p>Войдите в систему → добавьте заказчика → создайте заказ → добавьте услуги → примите оплату.</p></div><a class="btn" href="orders.html?new=1">Новый заказ →</a></div>
<div class="help-layout"><nav class="card card-pad help-toc" aria-label="Разделы руководства"><h2>Содержание</h2><a href="#start">01 · Начало работы</a><a href="#clients">02 · Заказчики</a><a href="#orders">03 · Заказы и услуги</a><a href="#production">04 · Производство и макеты</a><a href="#payments">05 · Оплата</a><a href="#stock">06 · Материалы</a><a href="#questions">Частые вопросы</a></nav><div class="help-sections">
<section class="card card-pad" id="start"><span class="info-kicker">01 / ПОДГОТОВКА</span><h2>Начало работы</h2><p>Откройте приложение и введите свой логин и пароль. После входа имя и роль появятся справа вверху. Для завершения работы нажмите «Выйти». На странице <a href="index.html">«Обзор»</a> доступны статистика, этапы производства, последние заказы и материалы на исходе. Нажмите карточку заказа, чтобы открыть подробности.</p></section>
<section class="card card-pad" id="clients"><span class="info-kicker">02 / КОНТАКТЫ</span><h2>Добавьте заказчика</h2><ol><li>Откройте <a href="clients.html">«Заказчики»</a> и нажмите «Новый заказчик».</li><li>Укажите ФИО, при необходимости — телефон и email.</li><li>Нажмите «Сохранить». Найти запись можно через поиск по ФИО, телефону или email.</li></ol><p>Кнопка «Изменить» позволяет обновить контакты.</p></section>
<section class="card card-pad" id="orders"><span class="info-kicker">03 / ОФОРМЛЕНИЕ</span><h2>Создайте заказ и добавьте услуги</h2><ol><li>В разделе <a href="orders.html">«Заказы»</a> нажмите «Новый заказ».</li><li>Выберите заказчика и нажмите «Создать заказ». Сотрудник определяется автоматически по вашей учётной записи.</li><li>В карточке заказа нажмите «+ Услуга», выберите услугу и количество.</li></ol><p>Каталог и цены настраиваются в разделе <a href="services.html">«Услуги»</a>. Сумма заказа рассчитывается по добавленным позициям. В списке заказов есть поиск и фильтр по статусу.</p></section>
<section class="card card-pad" id="production"><span class="info-kicker">04 / ПРОИЗВОДСТВО</span><h2>Обновляйте этапы и макеты</h2><p>В блоке «Итог по заказу» выбирайте актуальный статус:</p><div class="help-stages">Новый → В дизайне → В печати → Готов → Выдан</div><p>Для макета нажмите «+ Макет», укажите дизайнера и имя файла. Здесь сохраняется имя файла; загрузка самого файла не предусмотрена. Для каждого макета можно выбрать статус: «В работе», «На согласовании» или «Утверждён».</p></section>
<section class="card card-pad" id="payments"><span class="info-kicker">05 / РАСЧЁТЫ</span><h2>Запишите оплату</h2><ol><li>В карточке заказа посмотрите сумму и остаток к оплате.</li><li>Нажмите «Внести оплату», укажите сумму, тип и способ оплаты.</li><li>Нажмите «Провести оплату». Запись появится в истории оплат.</li></ol><p>Все суммы указаны в тенге (₸). Кнопка внесения оплаты недоступна, когда остаток к оплате равен нулю.</p></section>
<section class="card card-pad" id="stock"><span class="info-kicker">06 / СКЛАД</span><h2>Следите за материалами</h2><p>В разделе <a href="materials.html">«Материалы»</a> добавляйте наименование, единицу измерения и начальный остаток. Кнопка «Остаток +/-» позволяет указать изменение: положительное число для поступления, отрицательное — для списания.</p><p>Для расхода по заказу нажмите «+ Материал» у нужной позиции и укажите количество. Кнопка «Вернуть» возвращает списанный материал на склад. На странице «Обзор» показываются материалы с остатком не более 20 единиц.</p></section>
<section class="card card-pad" id="questions"><span class="info-kicker">ПОМОЩЬ</span><h2>Частые вопросы</h2><details><summary>Не загружаются данные — что делать?</summary><p>Убедитесь, что сервер приложения и SQL Server запущены. Проверьте подключение к базе в файле .env. Затем обновите страницу или нажмите «Повторить загрузку», если кнопка доступна.</p></details><details><summary>Изменения интерфейса не появились</summary><p>Нажмите Ctrl + F5, чтобы перезагрузить страницу с обновлением файлов.</p></details><details><summary>Как закрыть окно без сохранения?</summary><p>Нажмите «Отмена», крестик, клавишу Escape или на затемнённую область вокруг окна.</p></details><details><summary>Что происходит при удалении заказа?</summary><p>Удаляются заказ, его позиции, оплаты и макеты. Списанные материалы возвращаются на склад. Удаление нельзя отменить — внимательно читайте подтверждение.</p></details></section>
</div></div>
